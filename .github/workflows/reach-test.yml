# 해외(GitHub) 서버에서 예약 사이트에 접속되는지 확인하는 일회성 테스트 (계정 정보 사용 안 함)
name: reach-test
on: workflow_dispatch
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - name: 사이트 접속 확인
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in \
            https://www.ycs.or.kr/fmcs/133 \
            "https://srent.y-sisul.or.kr/page/rent/s04.od.list.asp" \
            "https://www.efmc.or.kr/rest/common/company?type=F" \
            https://sports.gangseo.seoul.kr/fmcs/64 \
            "https://sports.happysd.or.kr/rest/common/company?type=F" \
            "https://booking.gwanakgongdan.or.kr/rest/common/company?type=F" \
            https://www.guro-gurosportsclub.or.kr/fmcs/3 \
            "https://life.gangnam.go.kr/rest/common/company?type=F" \
            "https://reserv.bucheon.go.kr/site/main/lending/lendingDetail?lending_info_seq=115&inst_cate=01" \
            "https://www.jdtennisclub.com/api/schedules?date=2026-10-20" \
            https://kapi.kakao.com ; do
            r=$(curl -sk -o /tmp/b -m 20 -A "$UA" -w '%{http_code} %{time_total}s %{size_download}B' "$u" || echo "FAIL")
            echo "$r  $u"
          done
